{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Create Your Password</h3>
            </div>
            <div class="card-body">
                <p class="text-muted">Welcome! Please create a password for your account.</p>
                <p class="small">You'll use your email (<strong>{{ current_user.email }}</strong>) and this password to
                    log in next time.</p>
                <hr>
                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6"
                            placeholder="At least 6 characters">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                            required minlength="6" placeholder="Re-enter your password">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Create Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

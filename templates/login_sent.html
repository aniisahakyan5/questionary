{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body text-center">
                <h3 class="text-success mb-4"><i class="fas fa-paper-plane"></i> Link Sent!</h3>
                <p class="lead">We've sent a login link to <strong>{{ email }}</strong>.</p>
                <p>Please check your inbox (and spam folder) and click the link to sign in.</p>
                <hr>
                <p class="small text-muted">Dev Note: Check the server console for the link if email is not configured.
                </p>
                <a href="{{ url_for('login') }}" class="btn btn-outline-secondary btn-sm">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
